<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{text-align: center;}
    </style>
</head>
<body>
    <script>
        let a = prompt("marks?");

        if(a>=90){
            document.write("A+");
        }else if(a>79){
            document.write("A");
        }else if(a>69){
            document.write("B");
        }else if(a>59){
            document.write("C");
        }else{
            document.write("FAIL");
        }

    </script>
</body>
</html>
