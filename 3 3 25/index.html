<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-size: 90px;
        }
    </style>
</head>
<body>
    <script>
        confirm("are you ready??")
        let x = parseInt(prompt("enter your value"));
        let y = parseInt(prompt("enter your second value"));
        let result =(x+y);
        document.write(result, "<br>");
        let second_result =(x-y);
        document.write(second_result, "<br>");
        let third_result =(x*y);
        document.write(third_result, "<br>");
        let forth_result =(x/y);
        document.write(forth_result, "<br>");
        let fifth_result =(x%y);
        document.write(fifth_result, "<br>");
        let v = eval("9+10")
        console.log(v) 
    </script>
</body>
</html>
