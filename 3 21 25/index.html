<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare</title>
    <style>
        body {
            background-color: aqua;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            border: none;
            cursor: pointer;
            background-color: blue;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background-color: red;
        }

        /* Centered Popup */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal button {
            margin-top: 10px;
            background: green;
        }
    </style>
</head>
<body>

    <button onclick="dare()">Dare</button>
    <button onclick="truth()">Truth</button>

    <!-- Custom Popup Structure -->
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
        <p id="message">Placeholder</p>
        <input type="text" id="inputBox" style="display: none;">
        <button onclick="closeModal()">OK</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
