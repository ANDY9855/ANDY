<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        .flex-container{
            display: flex;
            flex-wrap: nowrap;
            background-color: green;
        }
        .flex-container>div{
            background-color: aqua;
            margin: 6px;
            text-align: center;
            width: 70px;
            line-height: 90px;
            font-size: 40px;
        }
        .flex-code{
            display: flex;
            flex-wrap: wrap;
            background-color: gray;
            border-radius: 40px
        }
        .flex-code>div{
            background-color: chocolate;
            margin: 6px;
            text-align: center;
            width: 70px;
            line-height: 90px;
            font-size: 40px;
            border-radius: 50px;
        }
        .flex-chapri{
            display: flex;
            flex-wrap: wrap;
            background-color: pink;
            border-radius: 40px
        }
        .flex-chapri>div{
            background-color: blue;
            margin: 6px;
            text-align: center;
            width: 70px;
            line-height: 90px;
            font-size: 40px;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>
    <div class="flex-code">
        <div>a</div>
        <div>b</div>
        <div>c</div>
        <div>d</div>
        <div>e</div>
        <div>f</div>
        <div>g</div>
    </div>
    </div>
    <div class="flex-chapri">
        <div>a</div>
        <div>b</div>
        <div>c</div>
        <div>d</div>
        <div>e</div>
        <div>f</div>
        <div>g</div>
    </div>
    </div>

</body>
</html>
